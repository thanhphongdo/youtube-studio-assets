<style>
/* ============================================================
   BẢN ĐIỆN ẢNH — xem slide/bang-canh.md
   Không còn "slide": mỗi đơn vị là một CẢNH QUAY.
   · mọi hình TRÀN BỐN MÉP, không lề, không khung viền
   · không chrome cố định (tên kênh chỉ ở cảnh 1)
   · tối đa 6 chữ / 2 khối hiện cùng lúc
   · mọi chuyển động là hàm thuần của thời gian ảo t
     (không CSS animation, không transition, không setTimeout, không random)
   Khung dựng 1280x720, xuất 1920x1080.

:root{
  --nen:#0A1621; --nen2:#102434; --ke:#1E3A4E;
  --chu:#EAF2F7; --chu2:#8FA8BA; --chu3:#5E7589;
  --bac:#F2A33C; --nam:#64808F;
  --bang:#DCEAF2; --nuoc:#1B6B88; --do:#D4523C;
  /* ---- TẬP 3: MẶT TRĂNG ---- nhấn DUY NHẤT là --bac (bạc trăng) */
  --giay:#F7F7F4; --giay2:#EBEBE6; --bien-nhat:#DCE9F0; --dat-nhat:#E4E4E2; --chu-toi:#1A1C22;
  --trang:#E8E6DF;   /* bạc trăng — màu nhấn chính, thay chỗ --bac của tập 2 */
  --dat:#C98A4B;     /* đất ấm — Trái Đất, lục địa */
  --bien:#2E6F8E;    /* đại dương, thuỷ triều */
  --dem:#070B16;     /* nền đêm sâu, trời sao */
  --sanho:#E0705A;   /* san hô, sinh vật gian triều */
  --nhat:#F2C14E;    /* Mặt Trời, nhật thực */
  --giay:#F6F8F5; --giay2:#ECEFEA; --bien-nhat:#D8ECF7; --dat-nhat:#E6E6E6; --chu-toi:#1C2A22;
  --nga:#C8553D; --my:#2E6F8E; --anh:#7A6A9B; --vang:#E8C33C; --den:#0B0B0B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#03080D;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;
     color:var(--chu);-webkit-font-smoothing:antialiased}

.lop > svg{position:absolute;inset:0;width:100%;height:100%}

/* HUD = chữ, KHÔNG bị camera biến đổi */
.hud{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;opacity:0;will-change:opacity,transform}

.so{font-variant-numeric:tabular-nums;letter-spacing:-.025em}

      text-shadow:0 1px 3px rgba(3,8,13,1),0 2px 12px rgba(3,8,13,.98),0 0 30px rgba(3,8,13,.92)}

          text-shadow:0 4px 30px rgba(3,8,13,.9)}
.dv{font:700 30px/1 system-ui;color:var(--chu2);letter-spacing:0}
</style>

<script>
/* ============================================================
   THƯ VIỆN — mọi thứ là hàm thuần của t
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const el = (n, a, p) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
const cl  = (x, a, b) => x < a ? a : (x > b ? b : x);
const ez  = x => { x = cl(x, 0, 1); return x * x * (3 - 2 * x); };
const ezo = x => { x = cl(x, 0, 1); return 1 - (1 - x) * (1 - x) * (1 - x); };
const lerp = (a, b, u) => a + (b - a) * cl(u, 0, 1);
const op  = (e, v) => { if (e) e.style.opacity = v; };
const soVN = n => Math.round(n).toLocaleString("vi-VN");
const txt = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
/* giả ngẫu nhiên TẤT ĐỊNH — không dùng Math.random */
const rn = (i, j) => { const x = Math.sin(i * 127.1 + (j || 0) * 311.7 + 7.13) * 43758.5453;
  return x - Math.floor(x); };
/* cửa sổ hiện chữ: 1 trong khoảng [a,b], mờ dần ở hai đầu */
const cua = (t, a, b, f) => { f = f === undefined ? .42 : f;
  return cl(Math.min(ez((t - a) / f), 1 - ez((t - b) / f)), 0, 1); };
/* hiện một khối chữ: mờ + nhích lên */
function kh(id, t, a, b, f, dy) {
  const e = document.getElementById(id); if (!e) return 0;
  const u = cua(t, a, b === undefined ? 1e9 : b, f);
  e.style.opacity = u;
  const v = ez((t - a) / (f === undefined ? .42 : f));
  e.style.transform = v < 1 ? "translateY(" + ((dy === undefined ? 12 : dy) * (1 - v)).toFixed(2) + "px)" : "";
  return u;
}
/* giờ (tính theo cảnh) mà bước k hiện ra; chưa tới thì +vô cực */
const moc = (c, k) => c.since(k) >= 0 ? c.t - c.since(k) : 1e9;
const veDan = (p, u) => {
  /* VÁ 21/11: dùng pathLength="1000" thay cho getTotalLength().
     Lý do: trong <g transform="scale(k)"> hoặc khi có vector-effect:non-scaling-stroke,
     trình duyệt đo nét gạch bằng đơn vị MÀN HÌNH còn getTotalLength() trả về đơn vị
     NGƯỜI DÙNG -> đường chỉ vẽ được 1/k chặng rồi tắt im lặng, không báo lỗi JS. */
  /* VÁ 2: không nhớ đệm độ dài nữa. Bản cũ cache p.__L ở lần gọi đầu, nên đường nào
     được dựng/đổi hình SAU lần gọi đó sẽ tính dash theo độ dài cũ -> vẽ thiếu, im lặng. */
  const d = p.getAttribute("d");
  if (p.__d !== d) { p.__d = d; p.setAttribute("pathLength", "1000"); }
  p.setAttribute("stroke-dasharray", 1000);
  p.setAttribute("stroke-dashoffset", 1000 * (1 - cl(u, 0, 1)));
};
/* camera: biến đổi từng lớp theo chiều sâu data-sau (thị sai) */
function cam(root, c) {
  /* nhịp thở: một dao động chậm cộng thêm, để KHÔNG khung hình nào đứng yên
     kể cả khi chuyển động chính đã tới đích */
  const tt = c.t || 0;
  const bx = (c.x || 0) + 11 * Math.sin(tt * .23 + .7);
  const by = (c.y || 0) + 8 * Math.cos(tt * .19);
  const bz = ((c.z === undefined ? 1 : c.z)) * (1 + .016 * Math.sin(tt * .17 + 1.3));
  c = { x: bx, y: by, z: bz, r: (c.r || 0) + .35 * Math.sin(tt * .13) };
  root.querySelectorAll(".lop").forEach(L => {
    const d = +(L.dataset.sau === undefined ? .5 : L.dataset.sau);
    const k = .3 + 1.25 * d;
    const z = 1 + ((c.z === undefined ? 1 : c.z) - 1) * (.45 + d);
    L.style.transform = "translate(" + ((c.x || 0) * k).toFixed(2) + "px," + ((c.y || 0) * k).toFixed(2) +
      "px) rotate(" + ((c.r || 0) * (.3 + d)).toFixed(3) + "deg) scale(" + z.toFixed(4) + ")";
  });
}
/* khung ngắm bản đồ: đặt viewBox theo tâm + bề rộng (đơn vị bản đồ) */
function ngam(sv, cx, cy, w) {
  const h = w * 720 / 1280;
  sv.__vb = [cx - w / 2, cy - h / 2, w, h];
  set(sv, { viewBox: sv.__vb.join(" ") });
}
/* đổi toạ độ bản đồ -> toạ độ khung hình 1280x720 */
function toaDo(sv, p) { const v = sv.__vb;
  return [(p[0] - v[0]) / v[2] * 1280, (p[1] - v[1]) / v[3] * 720]; }
/* đặt một nhãn HUD vào đúng điểm bản đồ */
function ghim(id, sv, p, dx, dy) {
  const e = document.getElementById(id); if (!e) return;
  const s = toaDo(sv, p);
  e.style.left = (s[0] + (dx || 0)).toFixed(1) + "px";
  e.style.top  = (s[1] + (dy || 0)).toFixed(1) + "px";
}

/* ---------- tiện ích MÀU: gradient khai báo một lần cho mỗi <svg> ----------
   Mỗi <svg> phải có tiền tố id riêng: cả 14 cảnh cùng nằm trong một tài liệu,
   nên url(#g) sẽ ăn nhầm defs của cảnh khác nếu trùng id. */
function defsOf(sv){
  let d = sv.querySelector(":scope > defs");
  if (!d) { d = document.createElementNS(NS, "defs"); sv.insertBefore(d, sv.firstChild); }
  return d;
}
function stops(g, a){ a.forEach(x => el("stop", { offset: x[0], "stop-color": x[1],
  "stop-opacity": x[2] === undefined ? 1 : x[2] }, g)); return g; }
function gradL(sv, id, x1, y1, x2, y2, a){
  return stops(el("linearGradient", { id: id, gradientUnits: "userSpaceOnUse",
    x1: x1, y1: y1, x2: x2, y2: y2 }, defsOf(sv)), a); }
function gradR(sv, id, cx, cy, r, a){
  return stops(el("radialGradient", { id: id, gradientUnits: "userSpaceOnUse",
    cx: cx, cy: cy, r: r }, defsOf(sv)), a); }
function gradB(sv, id, a){          /* theo hộp bao — dùng lại cho nhiều hình */
  return stops(el("radialGradient", { id: id }, defsOf(sv)), a); }
/* một mảng phủ hoà trộn: 'screen' để thêm ánh sáng, 'multiply' để thêm bóng */
function phu(sv, id, che, a, x, y, w, h){
  const r = el("rect", { x: x === undefined ? -200 : x, y: y === undefined ? -200 : y,
    width: w === undefined ? 1680 : w, height: h === undefined ? 1120 : h,
    fill: "url(#" + id + ")" }, sv);
  r.style.mixBlendMode = che; return r;
}

/* ---------- các mảnh vẽ dùng lại ---------- */
function sao(sv, n) {           /* trường sao tất định */
  const g = el("g", {}, sv);
  for (let i = 0; i < n; i++)
    el("circle", { cx: (rn(i, 1) * 1700 - 210).toFixed(1), cy: (rn(i, 2) * 1060 - 170).toFixed(1),
      r: (.5 + rn(i, 3) * 1.3).toFixed(2), fill: "#BFD6E4",
      opacity: (.12 + rn(i, 4) * .5).toFixed(2) }, g);
  return g;
}
function hat(sv, n, mau) {      /* bụi / tinh thể trôi */
  const a = [];
  for (let i = 0; i < n; i++)
    a.push(el("circle", { cx: 0, cy: 0, r: (.8 + rn(i, 7) * 2.2).toFixed(2),
      fill: mau || "#CFE3EF", opacity: 0 }, sv));
  return a;
}
/* cần cẩu giàn ở cảng */
function canCau(p, x, y, s, mau) {
  const g = el("g", { transform: "translate(" + x + " " + y + ") scale(" + s + ")" }, p);
  const d = { fill: "none", stroke: mau, "stroke-width": 7, "stroke-linecap": "round" };
  el("path", Object.assign({ d: "M-70 0 L-70 -150 M70 0 L70 -150 M-70 -150 L70 -150" }, d), g);
  el("path", Object.assign({ d: "M-150 -150 L170 -150 M-150 -150 L-150 -186 M170 -150 L210 -210" }, d), g);
  el("path", Object.assign({ d: "M-70 -150 L-20 -230 L120 -230 L70 -150" }, d), g);
  el("path", Object.assign({ d: "M20 -150 L20 -96 M-14 -96 L54 -96 L54 -68 L-14 -68 Z" },
    { fill: mau, stroke: mau, "stroke-width": 4 }), g);
  return g;
}
/* sáu màu thân công-ten-nơ có thật ngoài bãi: đỏ gỉ, lục thông, vàng đất,
   lam thép, mận, ghi nhôm. Chọn tất định theo rn() nên mọi khung hình giống nhau. */
const HOP = ["#A8482F", "#3A7A3C", "#C08B2E", "#2C5F85", "#8A4262", "#8E9AA2"];
const hopMau = (i, k) => HOP[Math.floor(rn(i * 7.3 + 1.7, k * 3.1 + .9) * 6) % 6];
/* chồng công-ten-nơ nhìn ngang — TÔ ĐẶC, không còn viền rỗng */
function chong(p, x, y, cot, cao, w, h, mau, mo) {
  const g = el("g", {}, p);
  for (let i = 0; i < cot; i++)
    for (let k = 0; k < cao; k++) {
      if (rn(i + x, k + y) < .08) continue;
      const c = mau || hopMau(i + x * .13, k + y * .17);
      const o = (mo === undefined ? 1 : mo) * (.72 + .26 * rn(i + 3, k + 9));
      el("rect", { x: x + i * (w + 2), y: y - (k + 1) * (h + 2), width: w, height: h,
        fill: c, opacity: o.toFixed(3) }, g);
      /* gân dọc + mép trên sáng, để khối hộp có chất chứ không phẳng lì */
      el("rect", { x: x + i * (w + 2), y: y - (k + 1) * (h + 2), width: w, height: 2.4,
        fill: "#FFFFFF", opacity: (o * .22).toFixed(3) }, g);
      el("rect", { x: x + i * (w + 2), y: y - (k + 1) * (h + 2) + h - 2.4, width: w, height: 2.4,
        fill: "#000000", opacity: (o * .35).toFixed(3) }, g);
    }
  return g;
}
/* quầng sáng tròn quanh một ngọn đèn */
function quang(p, x, y, r, mau, mo, id, sv) {
  gradB(sv, id, [[0, mau, .95], [.3, mau, .42], [1, mau, 0]]);
  return el("circle", { cx: x, cy: y, r: r, fill: "url(#" + id + ")",
    opacity: mo === undefined ? .55 : mo }, p);
}
/* con tàu công-ten-nơ vẽ to, mũi quay phải; gốc toạ độ = mặt nước giữa thân.
   Bản v2: TÔ MÀU thật — đáy sơn chống hà đỏ (mọi tàu hàng đều có), dải mạn,
   vệt gỉ, công-ten-nơ tô đặc 6 màu, cửa sổ thượng tầng sáng ấm, ống khói có dải hiệu. */
function tauLon(p, opt) {
  opt = opt || {};
  const g = el("g", {}, p);
  const V = "#9FC2D6", T = "#16303F", DO = "#8C3426";
  /* lườn */
  el("path", { d: "M-900 -8 L790 -8 L902 46 L866 152 L-868 152 Z", fill: T,
    stroke: V, "stroke-width": 3.2, "stroke-linejoin": "round" }, g);
  /* vệt gỉ chảy xuống từ mép boong */
  for (let i = 0; i < 26; i++)
    el("rect", { x: (-880 + rn(i, 301) * 1740).toFixed(0), y: -6,
      width: (5 + rn(i, 302) * 13).toFixed(1), height: (26 + rn(i, 303) * 86).toFixed(0),
      fill: "#A35A2C", opacity: (.16 + rn(i, 304) * .22).toFixed(2) }, g);
  /* dải mạn sáng chạy suốt thân — làm con tàu có "đường" chứ không phải khối phẳng */
  el("path", { d: "M-868 26 L884 26 L878 44 L-868 44 Z", fill: "#D8A24A", opacity: .55 }, g);
  /* đai gia cường chống băng + ĐÁY SƠN CHỐNG HÀ ĐỎ dọc mớn nước */
  const dai = el("g", {}, g);
  el("path", { d: "M-868 70 L880 70 L866 152 L-868 152 Z", fill: DO, stroke: "none" }, dai);
  el("path", { d: "M-868 70 L874 70", stroke: "#E7C9A0", "stroke-width": 3,
    "stroke-dasharray": "16 10", opacity: .7 }, dai);
  for (let i = 0; i < 14; i++)
    el("rect", { x: (-860 + rn(i, 311) * 1700).toFixed(0), y: 98,
      width: (10 + rn(i, 312) * 26).toFixed(0), height: (14 + rn(i, 313) * 34).toFixed(0),
      fill: "#5E2A20", opacity: (.2 + rn(i, 314) * .3).toFixed(2) }, dai);
  g.__dai = dai;
  /* đường ráp thép */
  for (let i = 0; i < 22; i++)
    el("line", { x1: -860 + i * 80, y1: -6, x2: -860 + i * 80, y2: 94,
      stroke: "#0F2535", "stroke-width": 1.4, opacity: .55 }, g);
  /* thượng tầng + ống khói ở đuôi */
  const tt = el("g", {}, g);
  el("rect", { x: -872, y: -228, width: 252, height: 220, fill: "#1B3747",
    stroke: V, "stroke-width": 3 }, tt);
  /* cửa sổ sáng ấm — 4 tầng */
  for (let r = 0; r < 4; r++)
    for (let i = 0; i < 9; i++) {
      if (rn(r * 11 + i, 321) < .22) continue;
      el("rect", { x: -856 + i * 26, y: -206 + r * 44, width: 15, height: 13,
        fill: "#FFCF86", opacity: (.45 + rn(r + 2, i + 5) * .5).toFixed(2) }, tt);
    }
  /* ống khói: thân sẫm + dải hiệu đỏ và vạch trắng */
  el("rect", { x: -700, y: -302, width: 62, height: 76, fill: "#10242F",
    stroke: V, "stroke-width": 3 }, tt);
  el("rect", { x: -700, y: -288, width: 62, height: 26, fill: "#B33B2C" }, tt);
  el("rect", { x: -700, y: -276, width: 62, height: 7, fill: "#EDE4D6" }, tt);
  el("path", { d: "M-690 -302 L-690 -342", stroke: V, "stroke-width": 2.4 }, tt);
  /* đèn cột buồm + đèn hành trình (mạn phải LỤC, mạn trái ĐỎ — luật hàng hải) */
  el("circle", { cx: -690, cy: -346, r: 7, fill: "#FFF4DC", opacity: .95 }, tt);
  el("circle", { cx: 884, cy: -16, r: 8, fill: "#5BE39A", opacity: .9 }, g);
  el("circle", { cx: -872, cy: -16, r: 8, fill: "#F2503C", opacity: .9 }, g);
  g.__tt = tt;
  /* chồng công-ten-nơ trên boong — TÔ ĐẶC */
  const kho = el("g", {}, g);
  for (let r = 0; r < 5; r++) {
    const x0 = -600 + r * 26, n = Math.floor((790 - x0 - r * 34) / 58);
    for (let i = 0; i < n; i++) {
      if (rn(r * 13 + i, r + 2) < .07) continue;
      const c = hopMau(i + r * .31, r * 2.7 + 4.1);
      const o = (.95 - r * .07);
      el("rect", { x: x0 + i * 58, y: -8 - (r + 1) * 40, width: 52, height: 36,
        fill: c, opacity: o.toFixed(2) }, kho);
      el("rect", { x: x0 + i * 58, y: -8 - (r + 1) * 40, width: 52, height: 3,
        fill: "#FFFFFF", opacity: (o * .24).toFixed(2) }, kho);
      el("rect", { x: x0 + i * 58, y: -11 - r * 40, width: 52, height: 3,
        fill: "#03080D", opacity: (o * .45).toFixed(2) }, kho);
    }
  }
  g.__kho = kho;
  return g;
}
/* sóng nước: path tuần hoàn, dịch theo t */
function song(p, y, bien, buoc, mau, w) {
  /* biên phải RỘNG hơn khung nhiều: máy quay lia tới ±440 và lùi tới z=0,92,
     biên cũ -400..1700 lọt mép, lòi ra nền trời cam phía sau. */
  let d = "M-1000 " + (y + 900) + " L-1000 " + y;
  for (let x = -1000; x <= 2400; x += buoc)
    d += " Q" + (x + buoc / 2) + " " + (y - bien) + " " + (x + buoc) + " " + y;
  d += " L2400 " + (y + 900) + " Z";
  return el("path", { d: d, fill: mau, opacity: .9, stroke: "none", "stroke-width": w || 0 }, p);
}
/* dấu ✕ */
function veX(p, x, y, r, mau) {
  const g = el("g", {}, p);
  el("line", { x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: mau,
    "stroke-width": 3.6, "stroke-linecap": "round" }, g);
  el("line", { x1: x + r, y1: y - r, x2: x - r, y2: y + r, stroke: mau,
    "stroke-width": 3.6, "stroke-linecap": "round" }, g);
  return g;
}

/* ---- bản đồ cực v2: mười lớp, xem danh-gia-lai-canh.md ----
   pre = tiền tố id riêng cho mỗi cảnh, vì 14 cảnh cùng nằm trong một tài liệu. */
function banDoCuc(sv, pre) {
  sv.innerHTML = "";
  const C = B.cuc, P = k => pre + "-" + k, U = k => "url(#" + pre + "-" + k + ")";

  /* biển có độ sâu: bồn Bắc Cực sâu → vành đại dương mở → vĩ độ thấp lam ngọc */
  gradR(sv, P("oc"), C.CX, C.CY, C.R, [
    [0, "#12415A"], [.12, "#0B2B3E"], [.30, "#06192A"], [.52, "#0A2838"],
    [.78, "#0F4A60"], [1, "#166476"]]);
  /* đất có sắc địa hình: băng → đài nguyên ô-liu → taiga lục → thảo nguyên → nâu ấm */
  gradR(sv, P("la"), C.CX, C.CY, C.R, [
    [0, "#DEE9E8"], [.11, "#A9B698"], [.22, "#75824C"], [.36, "#3F7038"],
    [.52, "#4C7A3A"], [.66, "#6A7135"], [.84, "#84652F"], [1, "#94703F"]]);
  /* chỏm băng biển quanh cực */
  gradR(sv, P("bi"), C.CX, C.CY, C.R * .34, [
    [0, "#EAF5FA", .58], [.40, "#D2E6F0", .44], [.72, "#9EC6DA", .20], [1, "#7FB2CB", 0]]);
  /* dải ngày–đêm: bình minh hổ phách → hồng → chàm → đêm */
  gradL(sv, P("dn"), C.CX, C.CY, C.CX + C.R, C.CY, [
    [0, "#FFD39A", 0], [.05, "#EDA868", .34], [.13, "#9A5A6C", .30],
    [.30, "#243055", .54], [.62, "#0B1228", .76], [1, "#060A18", .84]]);
  gradL(sv, P("bm"), C.CX - C.R * .34, C.CY, C.CX, C.CY, [
    [0, "#FFC98A", 0], [1, "#FFC08A", .17]]);
  gradB(sv, P("den"), [[0, "#FFE8C2", .95], [.32, "#F5A93F", .5], [1, "#F5A93F", 0]]);
  const cp = el("clipPath", { id: P("dia") }, defsOf(sv));
  el("circle", { cx: C.CX, cy: C.CY, r: C.R }, cp);

  el("rect", { x: -2000, y: -2000, width: 6000, height: 6000, fill: "#040F18" }, sv);
  /* MỌI THỨ nằm trong "quay" để cảnh 13 xoay được cả bán cầu */
  const quay = el("g", {}, sv);
  el("circle", { cx: C.CX, cy: C.CY, r: C.R, fill: U("oc") }, quay);

  /* lưới kinh vĩ — mờ, chỉ để có nhịp */
  const luoi = el("g", { opacity: .55 }, quay);
  [15, 30, 45, 60, 75].forEach(lat =>
    el("circle", { cx: C.CX, cy: C.CY, r: (90 - lat) / 90 * C.R, fill: "none",
      stroke: "#2A6076", "stroke-width": 1.2, opacity: .5 }, luoi));
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6;
    el("line", { x1: C.CX, y1: C.CY, x2: C.CX + C.R * Math.sin(a), y2: C.CY + C.R * Math.cos(a),
      stroke: "#204C60", "stroke-width": .9, opacity: .45 }, luoi);
  }
  el("circle", { cx: C.CX, cy: C.CY, r: C.R, fill: "none", stroke: "#2E6B82",
    "stroke-width": 2.2, "stroke-dasharray": "9 11", opacity: .6 }, luoi);

  /* THỀM LỤC ĐỊA: mỗi bờ biển vẽ thêm hai nét dày mờ -> quầng nước nông.
     Không dùng feGaussianBlur: 5.503 khung × bộ lọc toàn màn là quá đắt. */
  const them = el("g", {}, quay);
  [[26, "#11586F", .15], [12, "#238AA0", .20]].forEach(q =>
    C.paths.forEach(d => el("path", { d: d, fill: "none", stroke: q[1],
      "stroke-width": q[0], "stroke-linejoin": "round", opacity: q[2] }, them)));

  const dat = el("g", {}, quay);
  C.paths.forEach(d => el("path", { d: d, fill: U("la"), stroke: "#C2CBA2",
    "stroke-width": 1.1, "stroke-linejoin": "round", opacity: .96 }, dat));

  /* chỏm băng + tảng băng trôi */
  const bang = el("g", {}, quay);
  el("circle", { cx: C.CX, cy: C.CY, r: C.R * .34, fill: U("bi") }, bang);
  const troi = el("g", {}, bang);
  for (let i = 0; i < 46; i++) {
    const rr = C.R * (.05 + rn(i, 250) * .28), aa = rn(i, 251) * Math.PI * 2;
    const cx = C.CX + rr * Math.cos(aa), cy = C.CY + rr * Math.sin(aa);
    const sz = 3 + rn(i, 252) * 8;
    let d = "";
    for (let k = 0; k < 7; k++) {
      const th = k / 7 * Math.PI * 2, q = sz * (.55 + rn(i, 260 + k) * .75);
      d += (k ? "L" : "M") + (cx + q * Math.cos(th)).toFixed(1) + "," + (cy + q * Math.sin(th)).toFixed(1);
    }
    el("path", { d: d + "Z", fill: "#E8F3F9", opacity: (.16 + rn(i, 253) * .26).toFixed(2),
      stroke: "#8FC6DE", "stroke-width": .8, "stroke-opacity": .5 }, troi);
  }

  /* MÂY: ba cụm cung tròn trôi theo đới gió, mỗi cụm một tốc độ */
  const may = [];
  for (let k = 0; k < 3; k++) {
    const g = el("g", {}, quay);
    for (let i = 0; i < 17; i++) {
      const r = C.R * (.14 + rn(i, 200 + k) * .70);
      const jx = (rn(i, 270 + k) - .5) * 190, jy = (rn(i, 280 + k) - .5) * 190;
      el("circle", { cx: (C.CX + jx).toFixed(1), cy: (C.CY + jy).toFixed(1),
        r: r.toFixed(1), fill: "none", stroke: "#E2EEF5",
        "stroke-width": (4 + rn(i, 220 + k) * 13).toFixed(1),
        "stroke-linecap": "round", opacity: (.035 + rn(i, 230 + k) * .055).toFixed(3),
        "stroke-dasharray": (40 + rn(i, 240 + k) * 230).toFixed(0) + " " + (2 * Math.PI * r).toFixed(0),
        "stroke-dashoffset": (rn(i, 245 + k) * 2 * Math.PI * r).toFixed(0) }, g);
    }
    may.push(g);
  }

  /* DẢI NGÀY–ĐÊM: trên phép chiếu phương vị tâm cực, ranh giới ngày–đêm lúc
     phân điểm ĐÚNG là một đường thẳng qua cực — không phải vẽ cho đẹp. */
  const dem = el("g", { "clip-path": U("dia") }, quay);
  el("rect", { x: C.CX, y: C.CY - C.R, width: C.R, height: C.R * 2, fill: U("dn") }, dem);
  el("rect", { x: C.CX - C.R * .34, y: C.CY - C.R, width: C.R * .34, height: C.R * 2,
    fill: U("bm") }, dem);

  /* đèn thành phố hai đầu tuyến — nằm TRÊN lớp đêm nên đêm tới là sáng lên */
  const glow = p => el("circle", { cx: p[0], cy: p[1], r: 42, fill: U("den"), opacity: 0 }, quay);
  const glowN = glow(B.moc.ninhba), glowF = glow(B.moc.felixstowe);

  /* CỰC QUANG: vành 67°N -> bán kính (90-67)/90 * R */
  const RA = C.R * (90 - 67) / 90;
  const auro = [];
  const cq = (r, w, mau, dash, o) => { const e = el("circle", { cx: C.CX, cy: C.CY, r: r,
    fill: "none", stroke: mau, "stroke-width": w, "stroke-linecap": "round",
    "stroke-dasharray": dash, opacity: o }, quay); e.__o = o; auro.push(e); return e; };
  cq(RA * 1.00, 14, "#3FE09A", "96 44 150 62", .13);
  cq(RA * 1.07, 7,  "#9CF5CC", "58 76 112 54", .16);
  cq(RA * 0.92, 9,  "#49D6A8", "70 58 124 80", .10);
  cq(RA * 1.17, 11, "#A964DC", "52 122 78 146", .09);
  cq(RA * 0.84, 6,  "#7CE8C0", "40 96 66 118", .09);

  const pNam = el("path", { d: dd(B.nam), fill: "none", stroke: "#8FA7B4", "stroke-width": 5,
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, quay);
  const pBac = el("path", { d: dd(B.bac), fill: "none", stroke: "#F2A33C", "stroke-width": 5.6,
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, quay);
  /* vệt nước sáng kéo sau chấm tàu */
  const vet = el("path", { d: dd(B.bac), fill: "none", stroke: "#FFF0CE", "stroke-width": 9,
    "stroke-linecap": "round", opacity: 0 }, quay);
  const dauBac = el("circle", { cx: 0, cy: 0, r: 7, fill: "#FFF4DC", stroke: "#0A1621",
    "stroke-width": 2.6, opacity: 0 }, quay);
  const cuc = el("g", { opacity: 0 }, quay);
  el("circle", { cx: C.CX, cy: C.CY, r: 9, fill: "none", stroke: "#F2A33C", "stroke-width": 2.4 }, cuc);
  el("line", { x1: C.CX - 17, y1: C.CY, x2: C.CX + 17, y2: C.CY, stroke: "#F2A33C",
    "stroke-width": 1.6, opacity: .75 }, cuc);
  el("line", { x1: C.CX, y1: C.CY - 17, x2: C.CX, y2: C.CY + 17, stroke: "#F2A33C",
    "stroke-width": 1.6, opacity: .75 }, cuc);
  const cham = (p, mau, r) => el("circle", { cx: p[0], cy: p[1], r: r || 7, fill: mau,
    stroke: "#071219", "stroke-width": 2.6, opacity: 0 }, quay);
  const cNinh = cham(B.moc.ninhba, "#FFF4DC"), cFel = cham(B.moc.felixstowe, "#FFF4DC");
  const xs = [B.moc.biendong, B.moc.ando, B.moc.suez].map(p => {
    const g = veX(quay, p[0], p[1], 13, "#F05A3C"); op(g, 0); return g; });

  sv.__m = { pNam, pBac, vet, cuc, dauBac, xs, dat, luoi, them, bang, troi, may, dem,
             auro, glowN, glowF, quay, cNinh, cFel };
  return sv.__m;
}
/* nhịp sống dùng chung cho mọi cảnh bản đồ: dải ngày–đêm quay, mây trôi,
   băng trôi, cực quang rung, đèn thành phố đập. Hàm thuần của c.t. */
function nhipBanDo(m, c) {
  const C = B.cuc, tam = " " + C.CX + " " + C.CY + ")";
  const t = c.t;
  set(m.dem, { transform: "rotate(" + (24 + t * 1.25).toFixed(2) + tam });
  m.may.forEach((g, k) => set(g, { transform: "rotate(" +
    ((k % 2 ? -1 : 1) * t * (1.5 + k * .85)).toFixed(2) + tam }));
  set(m.troi, { transform: "rotate(" + (-t * 2.0).toFixed(2) + tam });
  m.auro.forEach((e, i) => {
    e.setAttribute("stroke-dashoffset", (t * (11 + i * 9) * (i === 2 ? -1 : 1)).toFixed(1));
    op(e, (e.__o * (.5 + .5 * Math.sin(t * (.47 + i * .26) + i * 1.9))).toFixed(3));
  });
  op(m.glowN, (.45 + .32 * Math.sin(t * .85)).toFixed(3));
  op(m.glowF, (.45 + .32 * Math.sin(t * .85 + 2.2)).toFixed(3));
}
/* vệt nước: chỉ hiện một đoạn dài L ngay sau đầu nét vẽ */
function veVet(p, u, L) {
  const T = p.__L2 || (p.__L2 = p.getTotalLength());
  p.setAttribute("stroke-dasharray", L + " " + (T + L));
  p.setAttribute("stroke-dashoffset", (L - T * cl(u, 0, 1)).toFixed(1));
}
/* điểm trên path theo tiến độ 0..1 (toạ độ bản đồ) */
function diem(p, u) { const L = p.__L || (p.__L = p.getTotalLength());
  const q = p.getPointAtLength(L * cl(u, 0, 1)); return [q.x, q.y]; }

        L.p.setAttribute("stroke", "#FFEFD2");
        L.q.setAttribute("stroke", "#F2A33C");
        L.d.setAttribute("fill", "#FFF8E8");
        const a3 = i * .55, uu = ezo((s - a3) / 2.4);
        dat2(L, uu, cl(ez((s - a3) / .5), 0, 1) * .95);
      });
    }
    kh("c12-nam", c.since(2), .5, 4.2);
    const s3 = c.since(3);
    kh("c12-chuyen", s3, .4, 6.4);
    txt("c12-sc", soVN(8 * ezo((s3 - .5) / 2.6)));
    kh("c12-teu", s3, 3.0, 7.6);
    txt("c12-steu", soVN(14000 * ezo((s3 - 3.1) / 1.6)));
    kh("c12-nguon", s3, 7.9);
  };
};

/* ---------- 13. câu hỏi — không chữ ---------- */
ANIM.c13 = root => {
  const { sv, m } = dungBanDo(root);
  veDan(m.pNam, 1); veDan(m.pBac, 1);
  m.pNam.setAttribute("stroke", "#7E95A4"); m.pNam.setAttribute("stroke-width", 4.4);
  op(m.cNinh, 1); op(m.cFel, 1); op(m.cuc, .45);
  /* cả bán cầu xoay chậm quanh Cực Bắc suốt cảnh — khung hình không đứng yên
     dù máy quay đã lùi hết tầm. Bản v2: cả mười lớp đều nằm sẵn trong m.quay. */
  const quay = m.quay;
  const bui = hat(sv, 90, "#BFD6E4");
  const phu = el("rect", { x: -3000, y: -3000, width: 9000, height: 9000,
    fill: "#03080D", opacity: 0 }, sv);
  const C = B.cuc;
  return c => {
    nhipBanDo(m, c);
    const u = ez(c.u);
    const k = noi(KHUNG.vua, KHUNG.dia, u);
    ngam(sv, k[0] + 22 * Math.sin(c.t * .2), k[1] + 15 * Math.cos(c.t * .17), k[2]);
    set(quay, { transform: "rotate(" + (-27 * c.u - 2.4 * Math.sin(c.t * .19)).toFixed(3) +
      " " + C.CX + " " + C.CY + ")" });
    const s1 = c.since(1), s2 = c.since(2);
    op(m.pNam, lerp(.85, .5, s1 >= 0 ? ez(s1 / 3) : 0));
    /* rút màu: đất liền mờ dần, vệt hổ phách đập chậm rồi lịm — vẫn còn thấy */
    const r = s2 >= 0 ? ez(s2 / 5) : 0;
    /* rút màu, nhưng KHÔNG rút xuống đen: đất và cực quang vẫn còn thấy */
    op(m.dat, 1 - .22 * r); op(m.luoi, 1 - .5 * r);
    op(m.cNinh, 1 - r); op(m.cFel, 1 - r); op(m.cuc, .45 * (1 - r));
    op(m.pBac, lerp(1, .5, r) * (.82 + .18 * Math.sin(c.t * 1.25)));
    op(phu, .17 * r);
    bui.forEach((b, i) => {        /* bụi băng trôi — toạ độ BẢN ĐỒ, theo khung ngắm */
      const v = sv.__vb, ph = (c.t * (.045 + rn(i, 111) * .06) + rn(i, 112)) % 1;
      set(b, { cx: (v[0] + rn(i, 113) * v[2] + ph * v[2] * .22).toFixed(1),
               cy: (v[1] + rn(i, 114) * v[3] - ph * v[3] * .1).toFixed(1),
               r: (v[2] / 1280 * (1 + rn(i, 115) * 2)).toFixed(2) });
      op(b, (Math.sin(ph * Math.PI) * .35).toFixed(2));
    });
  };
};

/* ---------- 14. mùa đông ---------- */
ANIM.c14 = root => {
  const V = root.querySelector("svg.ve"); V.innerHTML = "";
  /* Nguồn sáng chủ: nắng đông THẤP xiên qua băng — 15/3 ở Bắc Cực mặt trời vừa trở lại.
     Bóng trong khe băng ngả lam lạnh, mép đón nắng ngả hồng–hổ phách. */
  gradL(V, "g14bg", 0, 0, 0, 720, [[0, "#2E5E92", .42], [.55, "#2E5E92", .2], [1, "#1B3E66", .4]]);
  phu(V, "g14bg", "multiply", null, -200, -200, 1680, 1120);
  gradB(V, "g14mt", [[0, "#FFD3A6", .52], [.42, "#E88A6A", .2], [1, "#E88A6A", 0]]);
  const nang14 = el("ellipse", { cx: 60, cy: 400, rx: 560, ry: 460, fill: "url(#g14mt)" }, V);
  nang14.style.mixBlendMode = "screen";
  /* cực quang lục mờ ở mép trên */
  const auro14 = [];
  for (let i = 0; i < 4; i++)
    auro14.push(el("path", { d: "M" + (-160 + i * 380) + " -40 C " + (40 + i * 380) + " 90, " +
      (-60 + i * 380) + " 150, " + (180 + i * 380) + " 268", fill: "none",
      stroke: i % 3 === 2 ? "#A964DC" : "#4FE3A0", "stroke-width": (16 + rn(i, 801) * 26).toFixed(1),
      "stroke-linecap": "round", opacity: 0 }, V));
  gradR(V, "g14", 640, 360, 740, [
    [.5, "#03080D", 0], [1, "#060D1E", .72]]);
  el("rect", { x: -200, y: -200, width: 1680, height: 1120, fill: "url(#g14)" }, V);
  /* tinh thể sương bò vào từ mép khung */
  const nhanh = [];
  for (let i = 0; i < 26; i++) {
    const canh = i % 4;
    const x0 = canh === 0 ? -140 : canh === 1 ? 1420 : (-140 + rn(i, 81) * 1560);
    const y0 = canh === 2 ? -120 : canh === 3 ? 840 : (-120 + rn(i, 82) * 960);
    let d = "M" + x0.toFixed(0) + " " + y0.toFixed(0), x = x0, y = y0;
    const ax = (640 - x0), ay = (360 - y0), L = Math.hypot(ax, ay);
    for (let k = 0; k < 6; k++) {
      x += ax / L * (40 + rn(i, 90 + k) * 54) + (rn(i, 70 + k) - .5) * 48;
      y += ay / L * (40 + rn(i, 95 + k) * 54) + (rn(i, 60 + k) - .5) * 48;
      d += " L" + x.toFixed(0) + " " + y.toFixed(0);
    }
    nhanh.push(el("path", { d: d, fill: "none", stroke: "#AFCADB", "stroke-width": 1.3,
      "stroke-linecap": "round", opacity: 0 }, V));
  }
  const bui = hat(V, 70, "#FFFFFF");
  return c => {
    cam(root, { t: c.t, z: lerp(1.02, 1.34, c.u), x: lerp(-50, 66, c.u),
                y: lerp(28, -36, c.u), r: lerp(0, 1.2, c.u) });
    set(nang14, { rx: (560 + 26 * Math.sin(c.t * .5)).toFixed(1) });
    auro14.forEach((p, i) => op(p,
      (.12 * (.4 + .6 * Math.sin(c.t * (.55 + i * .22) + i * 1.7))).toFixed(3)));
    nhanh.forEach((p, i) => {
      const a = .35 + (i % 7) * .34;
      op(p, cl(ez((c.t - a) / 1.2), 0, 1) * .26);
      veDan(p, ezo((c.t - a) / 2.4));
    });
    bui.forEach((b, i) => {
      const ph = (c.t * (.07 + rn(i, 101) * .08) + rn(i, 102)) % 1;
      set(b, { cx: (-150 + rn(i, 103) * 1580 - ph * 120).toFixed(1),
               cy: (-60 + rn(i, 104) * 840 + ph * 150).toFixed(1) });
      op(b, (Math.sin(ph * Math.PI) * .4).toFixed(2));
    });
    kh("c14-nguon", c.t, 1.0, 4.6);
  };
};
/* ============================================================
   SỔ ĐĂNG KÝ CẢNH — để ba người dựng cảnh song song mà không
   đụng vào file của nhau. Mỗi khối ghi đúng MỘT file canh/khoi-N.js
   và chỉ gọi DANGKY({...}). Không ai sửa file này.
   ============================================================ */
const CANH_DK = [];
function DANGKY(o){ CANH_DK.push(o); }

<script>
{
  const noi = document.getElementById("them");
  for (const o of CANH_DK) {
    const s = document.createElement("section");
    s.className = "canh";
    s.dataset.anim = o.id;
    s.dataset.steps = o.steps || 0;
    s.innerHTML = (o.html || "") +
      '<div class="say">' + o.say.map(x =>
        typeof x === "string" ? "<p>" + x + "</p>"
                              : '<p data-min="' + (x.min||0) + '">' + x.text + "</p>").join("") +
      '</div>';
    noi.appendChild(s);
    ANIM[o.id] = o.anim;
  }
}

/* ============================================================
   BỘ MÁY CẢNH — giữ đúng hợp đồng của build_video.py
   ============================================================ */
const stage = document.getElementById("stage");
const canh = [...document.querySelectorAll(".canh")];
/* Cảnh có camera đẩy/lia: lớp nới rộng 14% mỗi bên để không lộ mép, và viewBox
   dịch đúng bằng phần nới ra, để 1 đơn vị SVG vẫn = 1 điểm ảnh của khung 1280x720
   (toạ độ 0,0 vẫn là góc trái trên của KHUNG HÌNH, không phải của lớp). */
canh.forEach(s => {
  if (s.querySelector("svg.bd")) return;          /* cảnh bản đồ: lớp phẳng, tự đặt viewBox */
  s.querySelectorAll(".lop").forEach(L => {
    L.classList.add("ov");
    L.querySelectorAll(":scope > svg").forEach(v =>
      v.setAttribute("viewBox", "-179.2 -100.8 1638.4 921.6"));
  });
});
const HOA_MAX = .42;                   /* hoà hình giữa hai cảnh, mức tối đa */
/* VÁ 21/11: hoà hình phải CO theo cảnh ngắn. Trước đây cố định .42s, nên một cảnh
   0,9s bị nuốt mất hơn nửa thời lượng vào lúc chồng hình — cảnh nhấn nhanh thành mờ tịt.
   Nay: không bao giờ chiếm quá 1/4 cảnh, và dưới 0,55s thì cắt cứng. */
const hoaCua = dur => dur < .55 ? 0 : Math.min(HOA_MAX, dur / 4);
const ST = { cur: 0, t0: 0, reveals: [], upd: null, virtual: false, vt: 0, tl: null, mo: null };
const now = () => ST.virtual ? ST.vt : performance.now() / 1000;
const nbuoc = i => +(canh[i].dataset.steps || 0);
const says = i => [...canh[i].querySelectorAll(".say p")];
function fit(){ stage.style.transform = "scale(" + Math.min(innerWidth / 1280, innerHeight / 720) + ")"; }
addEventListener("resize", fit); fit();

function enter(i, allOn, t0){
  const truoc = ST.cur, co = canh[truoc].classList.contains("active");
  ST.cur = Math.max(0, Math.min(canh.length - 1, i));
  if (truoc !== ST.cur && co) {
    if (ST.mo && ST.mo.el !== canh[truoc]) ST.mo.el.classList.remove("active");
    ST.mo = { el: canh[truoc], t: t0 === undefined ? now() : t0 };
    canh[truoc].style.opacity = 1;
  } else {
    canh.forEach(s => { if (s !== canh[ST.cur]) s.classList.remove("active"); });
    ST.mo = null;
  }
  const s = canh[ST.cur]; s.classList.add("active");
  ST.t0 = t0 === undefined ? now() : t0;
  ST.reveals = allOn ? Array.from({ length: nbuoc(ST.cur) }, () => ST.t0 - 100) : [];
  if (!ST.virtual) ST.dur = 13;
  const fn = ANIM[s.dataset.anim];
  ST.upd = fn ? fn(s) : null;
  if (!ST.virtual) history.replaceState(null, "", "#" + (ST.cur + 1));
}
function draw(){
  const t = now(), lt = t - ST.t0, s = canh[ST.cur];
  if (ST.mo) {
    const u = cl((t - ST.mo.t) / hoaCua(ST.dur||13), 0, 1);
    s.style.opacity = ez(u);
    if (u >= 1) { ST.mo.el.classList.remove("active"); ST.mo = null; }
  } else s.style.opacity = (ST.cur === 0 && ST.tl) ? ez(lt / .9) : 1;
  const step = ST.reveals.length;
  const DUR = ST.dur || 13;
  if (ST.upd) ST.upd({ t: lt, step, dur: DUR, u: cl(lt / DUR, 0, 1),
    since: k => k === 0 ? lt : (ST.reveals[k - 1] === undefined ? -1e9 : t - ST.reveals[k - 1]) });
  const p = says(ST.cur)[step];
  document.getElementById("notes").textContent = p ? p.textContent : "";
}
function next(){
  if (ST.reveals.length < nbuoc(ST.cur)) ST.reveals.push(now());
  else if (ST.cur < canh.length - 1) enter(ST.cur + 1, false);
}
function prev(){
  if (ST.reveals.length) ST.reveals.pop();
  else if (ST.cur > 0) enter(ST.cur - 1, true);
}
function tick(){ if (!ST.virtual) { draw(); requestAnimationFrame(tick); } }
addEventListener("keydown", e => {
  if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") enter(0);
  else if (e.key === "End") enter(canh.length - 1, true);
  else if (e.key.toLowerCase() === "f")
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});

/* ---------- API cho build_video.py ---------- */
window.__deck = () => canh.map((s, i) => ({
  frags: nbuoc(i),
  say: says(i).map(p => ({ text: p.textContent.trim(), min: +(p.dataset.min || 0) }))
}));
window.__video = tl => {
  ST.virtual = true; ST.tl = tl; document.body.classList.add("video");
  /* thời lượng thật của từng cảnh, để chuyển động máy quay trải đúng cả cảnh
     (trước đây camera chạy theo một hằng số rồi ĐỨNG HẲN — lỗi đã đo được) */
  tl.forEach((e, i) => { e.het = tl[i + 1] ? tl[i + 1].start - .5 : e.start + 13; });
};
window.__frame = T => {
  ST.vt = T;
  let i = 0; while (i + 1 < ST.tl.length && ST.tl[i + 1].start <= T) i++;
  const e = ST.tl[i];
  if (e.idx !== ST.cur || !canh[e.idx].classList.contains("active")) enter(e.idx, false, e.start);
  ST.dur = (e.het || (e.start + 13)) - e.start;
  ST.reveals = e.reveals.filter(r => r <= T);
  draw();
};

if (new URLSearchParams(location.search).has("video")) ST.virtual = true;
else { enter((parseInt(location.hash.slice(1)) || 1) - 1, false); tick(); }
</script>
